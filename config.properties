# ================================================================
# GitHell v2.0 - External Configuration
# Edit file ini untuk kustomisasi tanpa perlu recompile Java!
# ================================================================

# --- Commit Settings ---
daily.target=20
commit.interval.minutes=72
commits.per.push=5

# --- Branches (pisahkan dengan koma, tanpa spasi) ---
branches=main,abbys

# --- Repositories (pisahkan dengan koma)
# Tambah repo lain di sini, contoh:
# repositories=d:\\Xampp\\htdocs\\commit-automation-project,d:\\Projects\\repo2
repositories=d:\\Xampp\\htdocs\\commit-automation-project

# --- Commit Message Style: "random" atau "thematic" ---
# random   = pilih pesan natural secara acak (lebih realistis)
# thematic = pakai format "Daily auto-commit (1/20)"
commit.message.style=random

# --- Retry Settings (jika push gagal) ---
retry.count=3
retry.delay.minutes=5

# --- Notifikasi Discord ---
discord.enabled=false
discord.webhook.url=YOUR_DISCORD_WEBHOOK_URL_HERE

# --- Windows Toast Notification ---
windows.toast.enabled=true

# --- Behavior ---
# Randomize delay antar commit (200ms - 2000ms)
randomize.delays=true
# Git pull sebelum commit (hindari konflik)
git.pull.before.commit=true

# --- Statistics ---
stats.enabled=true
stats.file=stats.csv
